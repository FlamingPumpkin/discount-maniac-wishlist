<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Discount Maniac Wishlist | Smart Shopping & To-Do</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070a12;
      --surface: #0e1424;
      --surface-border: #1a233a;
      --surface-hover: #141d33;
      --text: #f1f5f9;
      --text-muted: #8291a5;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.16);
      --fire: #f43f5e;
      --fire-glow: rgba(244, 63, 94, 0.22);
      --success: #10b981;
      --price-tag: #fbbf24;
      --tag-todo: #818cf8;
      --tag-tobuy: #fb923c;
      --tag-wishlist: #ec4899;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 0.75rem;
      font-size: 13.5px;
      line-height: 1.45;
    }

    @media (min-width: 640px) {
      body { padding: 1.25rem 1.5rem; }
    }

    .container { max-width: 1100px; margin: 0 auto; }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.75rem;
      padding-bottom: 0.85rem;
      margin-bottom: 0.85rem;
      border-bottom: 1px solid var(--surface-border);
    }
    .brand { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
    .brand h1 { font-size: 1.2rem; font-weight: 800; color: #fff; letter-spacing: -0.3px; }
    .brand-badge {
      background: linear-gradient(135deg, rgba(244, 63, 94, 0.2), rgba(251, 191, 36, 0.2));
      border: 1px solid rgba(244, 63, 94, 0.4);
      color: #fda4af;
      padding: 0.12rem 0.5rem;
      border-radius: 6px;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .header-actions { display: flex; gap: 0.4rem; width: 100%; }
    @media (min-width: 640px) {
      .header-actions { width: auto; }
    }

    .btn {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      color: var(--text);
      padding: 0.45rem 0.75rem;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      transition: all 0.15s ease;
      flex: 1;
      min-height: 38px;
    }
    @media (min-width: 640px) {
      .btn { flex: initial; }
    }
    .btn:hover { background: var(--surface-hover); border-color: var(--accent); }
    .btn-primary { background: var(--accent); color: #04101d; border-color: var(--accent); font-weight: 700; }
    .btn-primary:hover { background: #7dd3fc; }

    .countdowns-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.45rem;
      margin-bottom: 0.85rem;
    }
    @media (max-width: 640px) {
      .countdowns-bar {
        grid-template-columns: 1fr;
        gap: 0.35rem;
      }
    }

    .countdown-card {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: 8px;
      padding: 0.45rem 0.65rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
    }
    .countdown-card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; bottom: 0;
      width: 3px;
      border-radius: 8px 0 0 8px;
    }
    .cd-ali::before { background: #f43f5e; }
    .cd-bf::before { background: #a855f7; }
    .cd-cm::before { background: #38bdf8; }
    .cd-info { display: flex; flex-direction: column; }
    .cd-title { font-size: 0.75rem; font-weight: 700; color: #fff; }
    .cd-date { font-size: 0.65rem; color: var(--text-muted); }
    .cd-timer {
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 0.78rem;
      font-weight: 700;
      color: #38bdf8;
      background: rgba(0,0,0,0.35);
      padding: 0.2rem 0.45rem;
      border-radius: 5px;
      letter-spacing: 0.3px;
    }

    .toolbar {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }
    @media (min-width: 640px) {
      .toolbar { flex-direction: row; justify-content: space-between; align-items: center; }
    }

    .tabs-wrapper {
      display: flex;
      gap: 0.3rem;
      background: var(--surface);
      padding: 0.2rem;
      border-radius: 8px;
      border: 1px solid var(--surface-border);
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .tabs-wrapper::-webkit-scrollbar { display: none; }

    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 0.4rem 0.65rem;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.75rem;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: all 0.15s;
    }
    .tab-btn.active { background: var(--accent-glow); color: var(--accent); }
    .tab-btn.deals-tab { color: #fda4af; }
    .tab-btn.deals-tab.active { background: var(--fire-glow); color: #f43f5e; }

    .search-input {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      color: var(--text);
      padding: 0.45rem 0.75rem;
      border-radius: 8px;
      width: 100%;
      font-size: 0.8rem;
      outline: none;
    }
    @media (min-width: 640px) {
      .search-input { width: 240px; }
    }
    .search-input:focus { border-color: var(--accent); }

    .task-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .task-row {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: 10px;
      padding: 0.65rem 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      transition: all 0.15s ease;
    }
    .task-row.deal-active {
      border-color: rgba(244, 63, 94, 0.45);
      background: linear-gradient(135deg, rgba(244, 63, 94, 0.06) 0%, rgba(14, 20, 36, 1) 40%);
      box-shadow: 0 0 12px -2px rgba(244, 63, 94, 0.15);
    }
    .task-row.completed { opacity: 0.4; }
    .task-row.completed .task-name { text-decoration: line-through; }

    .row-header {
      display: flex;
      align-items: flex-start;
      gap: 0.65rem;
    }

    .custom-check {
      width: 20px;
      height: 20px;
      cursor: pointer;
      accent-color: var(--accent);
      flex-shrink: 0;
      margin-top: 4px;
    }

    .thumb-wrapper {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      background: #141b2d;
      border: 1px solid rgba(255,255,255,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
      cursor: pointer;
      position: relative;
    }
    .thumb-wrapper:hover {
      border-color: var(--accent);
    }

    .item-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: #fff;
    }

    .title-col {
      display: flex;
      flex-direction: column;
      gap: 0.22rem;
      flex-grow: 1;
      min-width: 0;
    }

    .task-name {
      font-weight: 700;
      font-size: 0.88rem;
      color: #fff;
      line-height: 1.35;
      word-break: break-word;
    }

    .badge-strip {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      flex-wrap: wrap;
    }

    .badge {
      font-size: 0.65rem;
      font-weight: 800;
      padding: 0.1rem 0.4rem;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .badge-todo { background: rgba(129, 140, 248, 0.15); color: var(--tag-todo); }
    .badge-tobuy { background: rgba(251, 146, 60, 0.15); color: var(--tag-tobuy); }
    .badge-wishlist { background: rgba(236, 72, 153, 0.15); color: var(--tag-wishlist); }

    .deal-flame-badge {
      background: linear-gradient(135deg, #ef4444, #f59e0b);
      color: #fff;
      font-size: 0.62rem;
      font-weight: 800;
      padding: 0.1rem 0.4rem;
      border-radius: 4px;
      letter-spacing: 0.3px;
    }

    .row-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      padding-top: 0.35rem;
      border-top: 1px solid rgba(255,255,255,0.04);
      margin-top: 0.15rem;
    }

    .price-pill {
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 0.78rem;
      font-weight: 700;
      background: rgba(251, 191, 36, 0.1);
      color: var(--price-tag);
      border: 1px solid rgba(251, 191, 36, 0.28);
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
      white-space: nowrap;
    }

    .actions-group {
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .expand-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255,255,255,0.06);
      color: var(--text-muted);
      border-radius: 6px;
      padding: 0.25rem 0.6rem;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      min-height: 30px;
    }
    .expand-btn:hover { background: rgba(255, 255, 255, 0.12); color: #fff; }

    .del-btn {
      background: transparent;
      border: none;
      color: #64748b;
      cursor: pointer;
      padding: 0.25rem 0.5rem;
      font-size: 0.85rem;
      border-radius: 6px;
      min-height: 30px;
    }
    .del-btn:hover { color: #f43f5e; background: rgba(244, 63, 94, 0.1); }

    .row-details {
      display: none;
      padding-top: 0.55rem;
      margin-top: 0.2rem;
      border-top: 1px dashed var(--surface-border);
      font-size: 0.8rem;
    }
    .row-details.open { display: block; }

    .deal-breakdown-box {
      background: #080c16;
      border: 1px solid #1a253d;
      border-radius: 8px;
      padding: 0.65rem 0.75rem;
      margin-bottom: 0.5rem;
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.45rem;
    }
    @media (min-width: 640px) {
      .deal-breakdown-box { grid-template-columns: repeat(3, 1fr); }
    }

    .price-metric { display: flex; flex-direction: column; }
    .metric-title { font-size: 0.65rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
    .metric-val { font-size: 0.82rem; font-weight: 700; color: #fff; margin-top: 0.1rem; font-family: ui-monospace, monospace; }
    .metric-val.best { color: var(--success); }
    .metric-val.target { color: var(--accent); }

    .strategy-note {
      grid-column: 1 / -1;
      padding-top: 0.35rem;
      border-top: 1px solid rgba(255,255,255,0.06);
      font-size: 0.75rem;
      color: #94a3b8;
      line-height: 1.4;
    }
    .strategy-note strong { color: #e2e8f0; }

    .item-notes-text {
      color: #cbd5e1;
      line-height: 1.45;
      margin-bottom: 0.5rem;
      white-space: pre-wrap;
    }

    .links-strip { display: flex; flex-direction: column; gap: 0.35rem; }
    @media (min-width: 640px) {
      .links-strip { flex-direction: row; flex-wrap: wrap; }
    }

    .action-link {
      color: var(--accent);
      text-decoration: none;
      background: rgba(56, 189, 248, 0.08);
      border: 1px solid rgba(56, 189, 248, 0.2);
      padding: 0.3rem 0.6rem;
      border-radius: 6px;
      font-size: 0.75rem;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      word-break: break-all;
    }
    .action-link:hover { background: rgba(56, 189, 248, 0.2); }

    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px);
      display: none; justify-content: center; align-items: center; z-index: 100; padding: 1rem;
    }
    .modal-overlay.active { display: flex; }
    .modal-card {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: 12px;
      width: 100%; max-width: 480px;
      padding: 1.15rem;
      display: flex; flex-direction: column; gap: 0.65rem;
    }
    .modal-card h2 { font-size: 1.1rem; font-weight: 700; color: #fff; }
    .form-group { display: flex; flex-direction: column; gap: 0.2rem; }
    .form-group label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; font-weight: 700; }
    .form-control {
      background: #080c14; border: 1px solid var(--surface-border);
      border-radius: 6px; padding: 0.5rem; color: #fff; font-family: inherit; font-size: 0.82rem;
    }
    .form-control:focus { outline: none; border-color: var(--accent); }
    textarea.form-control { min-height: 60px; resize: vertical; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="brand">
      <h1>🎯 Discount Maniac Wishlist</h1>
      <span class="brand-badge" id="syncStatus">Connecting to Terminus…</span>
    </div>
    <div class="header-actions">
      <button class="btn btn-primary" onclick="openAddModal()">＋ Add item</button>
      <button class="btn" onclick="exportData()">💾 Export backup</button>
      <button class="btn" onclick="document.getElementById('importInput').click()">📥 Import</button>
      <input type="file" id="importInput" style="display:none" onchange="importData(event)">
    </div>
  </header>

  <div class="countdowns-bar">
    <div class="countdown-card cd-ali">
      <div class="cd-info">
        <span class="cd-title">AliExpress 11.11</span>
        <span class="cd-date">Nov 11</span>
      </div>
      <div class="cd-timer" id="timer-ali">--d --:--</div>
    </div>
    <div class="countdown-card cd-bf">
      <div class="cd-info">
        <span class="cd-title">Black Friday</span>
        <span class="cd-date">Nov 27</span>
      </div>
      <div class="cd-timer" id="timer-bf">--d --:--</div>
    </div>
    <div class="countdown-card cd-cm">
      <div class="cd-info">
        <span class="cd-title">Cyber Monday</span>
        <span class="cd-date">Nov 30</span>
      </div>
      <div class="cd-timer" id="timer-cm">--d --:--</div>
    </div>
  </div>

  <div class="toolbar">
    <div class="tabs-wrapper">
      <button class="tab-btn active" onclick="setFilter('all', this)">All (<span id="cnt-all">0</span>)</button>
      <button class="tab-btn deals-tab" onclick="setFilter('deals', this)">🔥 Deals (<span id="cnt-deals">0</span>)</button>
      <button class="tab-btn" onclick="setFilter('todo', this)">To-Do (<span id="cnt-todo">0</span>)</button>
      <button class="tab-btn" onclick="setFilter('tobuy', this)">To-Buy (<span id="cnt-tobuy">0</span>)</button>
      <button class="tab-btn" onclick="setFilter('wishlist', this)">Wishlist (<span id="cnt-wishlist">0</span>)</button>
      <button class="tab-btn" onclick="setFilter('pending', this)">Incomplete</button>
    </div>
    <input type="text" class="search-input" id="searchBox" placeholder="Quick search..." oninput="renderItems()">
  </div>

  <div class="task-list" id="taskList"></div>
</div>

<div class="modal-overlay" id="addModal">
  <div class="modal-card">
    <h2>New item</h2>
    <div class="form-group">
      <label>Category</label>
      <select id="modalType" class="form-control">
        <option value="todo">To-Do (Tasks / Routine)</option>
        <option value="tobuy">To-Buy (Supplies / Shopping)</option>
        <option value="wishlist">Wishlist (Wants / Deals)</option>
      </select>
    </div>
    <div class="form-group">
      <label>Item or task name</label>
      <input type="text" id="modalTitle" class="form-control" placeholder="e.g. Ninja air fryer">
    </div>
    <div class="form-group">
      <label>Image search keywords or URL</label>
      <input type="text" id="modalImg" class="form-control" placeholder="e.g. air fryer or https://...">
    </div>
    <div class="form-group">
      <label>Price / Estimate</label>
      <input type="text" id="modalPrice" class="form-control" placeholder="e.g. 775 zł (Smart)">
    </div>
    <div class="form-group">
      <label>Notes & Details</label>
      <textarea id="modalNotes" class="form-control" placeholder="Specs, dimensions, things to watch for..."></textarea>
    </div>
    <div class="form-group">
      <label>Link</label>
      <input type="text" id="modalLink" class="form-control" placeholder="https://...">
    </div>
    <div style="display:flex; justify-content: flex-end; gap:0.5rem; margin-top:0.4rem;">
      <button class="btn" onclick="closeAddModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveNewItem()">Save</button>
    </div>
  </div>
</div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
